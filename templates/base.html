<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TaskFlow{% endblock %} – TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <rect width="24" height="24" rx="7" fill="currentColor"/>
                    <path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                TaskFlow
            </a>
            <nav class="nav" aria-label="Main">
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Dashboard</a>
                <a href="{{ url_for('add_task') }}" class="nav-cta {{ 'active' if request.endpoint == 'add_task' }}">New task</a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-area" role="status">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" class="flash-close" aria-label="Dismiss message">&times;</button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">TaskFlow – a simple Flask &amp; SQLite to-do manager</footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
